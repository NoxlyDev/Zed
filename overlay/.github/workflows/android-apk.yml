name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  NDK_VERSION: 27.2.12479018
  CARGO_TERM_COLOR: never
  # Faster than the workspace default (codegen-units = 1) and no debuginfo bloat.
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
  CARGO_PROFILE_RELEASE_DEBUG: 0
  # Needed for devices with 16 KB pages (Android 15+). Env var form keeps the
  # workspace's .cargo/config.toml rustflags in effect.
  CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384"

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android
          rustc --version

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install NDK and build tools
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build native library
        run: |
          cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs \
            build --release -p zed_android

      - name: Bundle libc++_shared.so if the library needs it
        run: |
          lib=android/app/src/main/jniLibs/arm64-v8a/libzed_android.so
          ls -l "$lib"
          if "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -d "$lib" | grep -q "libc++_shared.so"; then
            cp "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" \
               android/app/src/main/jniLibs/arm64-v8a/
          fi
          ls -l android/app/src/main/jniLibs/arm64-v8a/

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk dist/zed-android-arm64.apk
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: zed-android-arm64-apk
          path: dist/zed-android-arm64.apk
