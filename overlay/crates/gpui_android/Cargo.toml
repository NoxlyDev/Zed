[package]
name = "gpui_android"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"
description = "Android platform backend for GPUI"

[lints]
workspace = true

[lib]
path = "src/gpui_android.rs"
doctest = false

[features]
default = ["game-activity"]
game-activity = ["android-activity/game-activity"]
native-activity = ["android-activity/native-activity"]

[target.'cfg(target_os = "android")'.dependencies]
anyhow.workspace = true
futures.workspace = true
gpui.workspace = true
gpui_wgpu.workspace = true
log.workspace = true
parking_lot.workspace = true
raw-window-handle.workspace = true
uuid = { workspace = true, features = ["v5"] }
android-activity = "0.6"
ndk = { version = "0.9", default-features = false, features = ["rwh_06"] }
jni = "0.21"
